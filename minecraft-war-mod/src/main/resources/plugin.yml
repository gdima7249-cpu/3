name: WarMod
version: ${project.version}
main: ru.warmod.WarMod
api-version: '1.20'
author: WarMod
description: Война стран - свои страны, ранги, казна, захват флагов, танки, режим соло против ИИ.
commands:
  war:
    description: Все команды войны стран
    usage: /war help
    aliases: [w, country, strana]
permissions:
  warmod.use:
    default: true
  warmod.create.free:
    description: Создавать страну бесплатно (выдаётся за реальные деньги через магазин сервера)
    default: false
  warmod.admin:
    description: Администрирование войны
    default: op
