# WarMod - настройки. После правки: /war admin reload

economy:
  start-balance: 200          # стартовый капитал игрока, $
  create-cost: 500            # цена создания страны, $ (бесплатно с правом warmod.create.free - его продают за реальные деньги)
  join-base: 100              # база цены входа: страна больше средней - платишь, меньше - тебе платят
  max-join-fee: 400
  max-join-bonus: 150
  compensation-per-refusal: 150   # награда победителю за каждого бойца побеждённой страны, не пожелавшего служить
  kill-reward: 25
  medic-reward: 15

limits:
  min-members: 10             # минимум мест в стране
  online-multiplier: 2.0      # лимит страны = средний онлайн сервера * множитель (50 онлайн -> 100 мест)

ranks:
  sergeant-merit: 100         # заслуг для автоповышения до сержанта
  officer-merit: 500          # заслуг для офицера (назначает офицер/генерал)
  leader-death-loses-country: true
  leader-demoted-to: SERGEANT

war:
  claim-radius: 40            # радиус территории вокруг флага: чужие не строят и не ломают блоки
  capture-radius: 4           # на каком расстоянии от флага идёт захват
  capture-seconds: 60         # сколько секунд удерживать флаг без защитников
  shield-minutes: 30          # защита новой страны от захвата
  offer-seconds: 60           # время на решение бойцов побеждённой страны: служить победителю или нет
  friendly-fire: false

score:
  conquest: 500
  kill: 5
  task: 10

ai:
  enabled: true
  raid-interval-seconds: 420  # как часто ИИ-страны идут в атаку на людей
  raid-lifetime-seconds: 300
  war-interval-seconds: 600   # как часто ИИ-страны воюют между собой
  growth-minutes: 5           # +1 к силе ИИ-страны
  max-strength: 20
  min-distance: 90            # где появляются ИИ-страны вокруг игрока
  max-distance: 220

web:
  enabled: false              # страница рейтинга: "страна месяца/года/за всё время"
  port: 8765
