<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#1a2108"/><stop offset=".55" stop-color="#0b0d10"/><stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#34E8FF"/><stop offset="1" stop-color="#D4FF3A"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="ring"><circle cx="320" cy="320" r="168"/></clipPath>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="200" fill="#D4FF3A" opacity=".08" filter="url(#soft)"/>
  <!-- прицел -->
  <g fill="none" stroke="url(#ln)" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <circle cx="320" cy="320" r="190"/>
    <path d="M320 70 V150 M320 490 V570 M70 320 H150 M490 320 H570"/>
  </g>
  <!-- график цены внутри прицела -->
  <g clip-path="url(#ring)">
    <path d="M150 400 L225 360 L280 385 L345 290 L395 320 L470 215 L500 230 V520 H150 Z" fill="#D4FF3A" opacity=".12"/>
  </g>
  <path d="M150 400 L225 360 L280 385 L345 290 L395 320 L470 215" fill="none" stroke="#D4FF3A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M430 205 L478 210 L470 256" fill="none" stroke="#D4FF3A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <circle cx="320" cy="320" r="190"/>
    <path d="M150 400 L225 360 L280 385 L345 290 L395 320 L470 215"/>
  </g>
</svg>
