plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.warfront'

base {
    archivesName = 'warfront'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                warfront {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'warfront'
            if (project.hasProperty('autoClient')) {
                // CI: сразу заходим в готовый мир и делаем скриншоты
                property 'warfront.autotest', 'true'
                args '--quickPlaySingleplayer', 'ci_world', '--width', '1280', '--height', '720'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'warfront'
            args '--nogui'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : 'warfront',
                'Specification-Vendor'  : 'warfront',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'warfront'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Дымовой тест подаёт команды серверу через stdin
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
