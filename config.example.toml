# Скопируйте в config.toml и правьте под себя. Всё, что не указано, берётся из faceless/config.py.

[paths]
output_dir = "output"          # готовые ролики и промежуточные файлы
db = "data/faceless.sqlite3"   # какие посты уже использованы, очередь публикаций
keep_work_files = false        # удалять промежуточные файлы (голос, субтитры) после рендера
delete_after_upload = true     # удалять mp4 после загрузки на все площадки — бережёт диск VPS

[reddit]
subreddits = ["AskReddit", "TrueOffMyChest", "tifu", "AmItheAsshole", "relationship_advice"]
sort = "top"            # top | hot
time = "day"            # для top: hour | day | week | month
limit = 50
min_score = 1500
min_chars = 300         # слишком короткие истории не удерживают
max_chars = 5000
top_comments = 4        # для «вопросных» сабов (AskReddit): сколько лучших ответов озвучить
question_subreddits = ["AskReddit", "NoStupidQuestions"]

[text]
language = "en"         # en — самая большая аудитория; ru тоже поддерживается
adapter = "auto"        # auto (Claude, иначе Gemini, иначе как есть) | claude | gemini | none | translate
model = "claude-opus-5-5"     # для Claude; дешевле: "claude-sonnet-5-5"
# Gemini: по очереди пробуем модели, пока одна не ответит (бесплатный тариф иногда «перегружен»)
gemini_models = ["gemini-flash-lite-latest", "gemini-3.1-flash-lite", "gemini-flash-latest"]
min_quality = 6         # Claude оценивает «смотрибельность» 1..10; ниже — пропускаем

[tts]
engine = "edge"         # edge | elevenlabs | silent (silent — для тестов без сети)
voices = ["en-US-ChristopherNeural", "en-US-AriaNeural", "en-US-GuyNeural", "en-US-JennyNeural"]
# для ru: ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural"]
rate = "+12%"           # чуть быстрее нормы — лучше удержание
elevenlabs_voice_ids = []
elevenlabs_model = "eleven_multilingual_v2"

[video]
width = 720            # 720x1280 собирается вдвое быстрее 1080x1920; для Shorts этого достаточно
height = 1280
fps = 30
max_part_seconds = 60   # длинные истории режутся на части с клиффхэнгером
font = "Inter"
font_size = 92
words_per_caption = 3
highlight_colors = ["&H0000F0FF", "&H0055FF55", "&H00FFD24D"]  # ASS BGR: жёлтый, зелёный, голубой
music_volume = 0.07
mirror_chance = 0.5     # случайное отражение фона по горизонтали
preset = "veryfast"     # x264: veryfast для слабого VPS, medium — если есть 4+ ядра
threads = 1             # 1 поток — бот в Telegram на том же сервере не будет тормозить; 0 = все ядра

[schedule]
timezone = "America/New_York"          # основная англоязычная аудитория — США
publish_times = ["11:50", "16:50", "19:50"] # обед, после школы/работы, вечер

[youtube]
enabled = true
client_secrets = "secrets/client_secret.json"
token = "secrets/youtube_token.json"
category_id = "24"                  # Entertainment
default_tags = ["reddit", "reddit stories", "askreddit", "shorts"]
contains_synthetic_media = true     # честная пометка синтетического голоса (требование YouTube)

[telegram]
enabled = false         # true — бот присылает готовый ролик вам в Telegram в момент слота (выложить вручную)

[tiktok]
enabled = false
privacy_level = "SELF_ONLY"         # неаудированные приложения могут постить только SELF_ONLY

[autopilot]
queue_target = 6   # сколько готовых, ещё не доставленных роликов держать в запасе; пополнение — `faceless make --fill`
