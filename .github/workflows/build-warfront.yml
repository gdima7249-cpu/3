name: Build Warfront

on:
  push:
    branches-ignore: ['ci-screens']
    paths: ['warfront/**', '.github/workflows/build-warfront.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warfront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
      - name: Сборка мода
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Warfront-jar
          path: warfront/build/libs/warfront-*.jar
      - name: Опубликовать jar в Releases
        if: github.ref_type == 'branch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls warfront/build/libs/warfront-*.jar | grep -v -- '-sources' | head -n1)
          echo "Публикую $JAR ($(stat -c%s "$JAR") байт)"
          gh release delete warfront-latest --cleanup-tag -y || true
          gh release create warfront-latest "$JAR" --target "$GITHUB_SHA" --prerelease \
            --title "Warfront (последняя сборка)" \
            --notes "Положи jar в папку mods (Forge 1.20.1). Сборка $GITHUB_SHA. Инструкция: warfront/README.md"
      - name: Дымовой тест (запуск сервера Minecraft с модом)
        run: python3 tools/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: warfront/run/logs/latest.log
          if-no-files-found: ignore
      - name: Подготовить мир для клиентского теста
        if: always()
        run: |
          mkdir -p run/saves
          rm -rf run/saves/ci_world
          cp -r run/world run/saves/ci_world || true
          rm -f run/saves/ci_world/session.lock
      - name: Клиентский тест со скриншотами (xvfb + программный OpenGL)
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa libxcursor1 libxrandr2 libxxf86vm1 libopenal1 >/dev/null
          rm -rf run/autotest
          printf 'tutorialStep:none\nsoundCategory_master:0.0\nrenderDistance:8\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" gradle runClient -PautoClient=true --no-daemon 2>&1 | tee client_run.log || true
          ls -la run/autotest || true
      - name: Опубликовать скриншоты в ветку ci-screens
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          cp warfront/run/autotest/*.png /tmp/shots/ 2>/dev/null || true
          cp warfront/run/logs/latest.log /tmp/shots/client_latest.log 2>/dev/null || true
          tail -n 300 warfront/client_run.log > /tmp/shots/client_run_tail.log 2>/dev/null || true
          cd /tmp && rm -rf shotrepo && mkdir shotrepo && cd shotrepo
          git init -q && git checkout -q -b ci-screens
          cp /tmp/shots/* . 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "скриншоты $GITHUB_SHA" || exit 0
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-screens
