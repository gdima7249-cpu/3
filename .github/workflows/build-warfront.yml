name: Build Warfront

on:
  push:
    paths: ['warfront/**', '.github/workflows/build-warfront.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warfront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
      - name: Сборка мода
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Warfront-jar
          path: warfront/build/libs/warfront-*.jar
      - name: Опубликовать jar в Releases
        if: github.ref_type == 'branch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls warfront/build/libs/warfront-*.jar | grep -v -- '-sources' | head -n1)
          echo "Публикую $JAR ($(stat -c%s "$JAR") байт)"
          gh release delete warfront-latest --cleanup-tag -y || true
          gh release create warfront-latest "$JAR" --target "$GITHUB_SHA" --prerelease \
            --title "Warfront (последняя сборка)" \
            --notes "Положи jar в папку mods (Forge 1.20.1). Сборка $GITHUB_SHA. Инструкция: warfront/README.md"
      - name: Дымовой тест (запуск сервера Minecraft с модом)
        run: python3 tools/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: warfront/run/logs/latest.log
          if-no-files-found: ignore
